[platformio]
default_envs = esp32

; 讓 lib/* 也能 #include "Config.h"（專案 include/ 預設只對 src/ 生效）
[env]
build_flags = -Iinclude

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
	arduino-libraries/Servo@^1.2.1
	featherfly/SoftwareSerial@^1.0
	feilipu/FreeRTOS@^11.1.0-0

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
	arduino-libraries/Servo@^1.2.1
	featherfly/SoftwareSerial@^1.0
	feilipu/FreeRTOS@^11.1.0-0

[env:esp32]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_ldf_mode = deep+
lib_deps =
    madhephaestus/ESP32Servo
    adafruit/Adafruit PWM Servo Driver Library
    https://github.com/stm32duino/VL53L7CX.git