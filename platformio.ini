[platformio]
default_envs = esp32

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
	arduino-libraries/Servo@^1.2.1
	featherfly/SoftwareSerial@^1.0
	feilipu/FreeRTOS@^11.1.0-0

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
	arduino-libraries/Servo@^1.2.1
	featherfly/SoftwareSerial@^1.0
	feilipu/FreeRTOS@^11.1.0-0

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo
    #arduino-libraries/Servo@^1.2.1