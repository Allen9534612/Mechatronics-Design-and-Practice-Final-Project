# mypy 設定。本專案只有 script/ 是 Python（韌體在 src/、lib/，與 mypy 無關）。
#
# 要停用 mypy：刪掉這個檔案不會停用——編輯器的 mypy 擴充套件仍會以預設值執行。
# 停用請關閉 VS Code 的 ms-python.mypy-type-checker 擴充套件，或在
# .vscode/settings.json 加上 "mypy-type-checker.ignorePatterns": ["**/*.py"]。
[mypy]
files = script
python_version = 3.10

# pyserial 沒有附型別資訊。想要真正檢查 serial 的用法，改裝
# types-pyserial（pip install types-pyserial）並移除下面這段。
[mypy-serial.*]
ignore_missing_imports = True
